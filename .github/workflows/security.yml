name: Security Scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies safely
        run: npm ci --ignore-scripts

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: OSV Scanner
        run: >-
          docker run --rm
          -v "$PWD:/src"
          ghcr.io/google/osv-scanner:v2.3.8
          scan source --recursive /src

  zap-baseline-scan:
    name: Live website ZAP scan (${{ matrix.site.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        site:
          - name: main
            target: https://oussafi.work
            artifact: zap-main
          - name: backup
            target: https://backup.oussafi.work
            artifact: zap-backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ matrix.site.target }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          allow_issue_writing: false
          fail_action: false
          artifact_name: ${{ matrix.site.artifact }}

  secret-scan:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog (push)
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --results=verified --fail

      - name: TruffleHog (pull request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified --fail

      - name: TruffleHog (full branch)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'push' &&
          github.event.before == '0000000000000000000000000000000000000000')
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified --fail
